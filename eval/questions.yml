# 60 条评测集：A 直接可答 / B 多指标对比 / C 必须澄清 / D 必须拒答
# A、B 两类带 expected_dsl（黄金 DSL），C、D 两类带 expect: clarify|refuse
# 跑法：python eval/run_l1.py（无需 API Key）；python eval/run_l2.py（需 Key）
#
# 约定：凡是落在 DWD（可按时间过滤）的题，黄金 DSL 都显式写出全量时间范围。
# 不写就会走「默认最近 7 天」，和模型的合理选择不一致，比的是默认值而不是能力。

# ---------- A 直接可答 ----------
- {id: A01, cls: A, q: "每天的浏览次数趋势", dsl: {"metrics": ["pv_cnt"], "dimensions": ["dt"], "order_by": [{"field": "dt", "dir": "asc"}], "time_range": {"start": "2017-11-25", "end": "2017-12-03"}}}
- {id: A02, cls: A, q: "每天的加购次数", dsl: {"metrics": ["cart_cnt"], "dimensions": ["dt"], "time_range": {"start": "2017-11-25", "end": "2017-12-03"}}}
- {id: A03, cls: A, q: "每天的购买次数", dsl: {"metrics": ["buy_cnt"], "dimensions": ["dt"], "time_range": {"start": "2017-11-25", "end": "2017-12-03"}}}
- {id: A04, cls: A, q: "整体活跃用户数是多少", dsl: {"metrics": ["active_uv"], "time_range": {"start": "2017-11-25", "end": "2017-12-03"}}}
- {id: A05, cls: A, q: "每天的活跃用户数", dsl: {"metrics": ["active_uv"], "dimensions": ["dt"], "time_range": {"start": "2017-11-25", "end": "2017-12-03"}}}
- {id: A06, cls: A, q: "购买用户数有多少", dsl: {"metrics": ["buy_uv"], "time_range": {"start": "2017-11-25", "end": "2017-12-03"}}}
- {id: A07, cls: A, q: "高活跃用户的购买用户数", dsl: {"metrics": ["buy_uv"], "filters": [{"field": "user_tier", "op": "=", "value": "high"}], "time_range": {"start": "2017-11-25", "end": "2017-12-03"}}}
- {id: A08, cls: A, q: "每天的浏览购买转化率", dsl: {"metrics": ["buy_pv_rate"], "dimensions": ["dt"], "time_range": {"start": "2017-11-25", "end": "2017-12-03"}}}

