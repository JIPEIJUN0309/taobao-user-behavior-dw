<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="640" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1F3864">淘宝用户行为离线数仓 · 架构图</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#7f7f7f">Taobao User-Behavior Offline Data Warehouse — Architecture</text>

  <!-- Source -->
  <rect x="330" y="86" width="240" height="52" rx="8" fill="#EAF0FA" stroke="#2E5496" stroke-width="1.5"/>
  <text x="450" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#1F3864">原始 CSV / Raw CSV</text>
  <text x="450" y="128" text-anchor="middle" font-size="11" fill="#595959">1亿行 / 100M rows · 3.4 GB</text>

  <!-- arrow -->
  <line x1="450" y1="138" x2="450" y2="168" stroke="#2E5496" stroke-width="2" marker-end="url(#a)"/>
  <text x="470" y="160" font-size="10" fill="#7f7f7f">hdfs dfs -put</text>

  <!-- HDFS -->
  <rect x="270" y="168" width="360" height="54" rx="8" fill="#1F3864"/>
  <text x="450" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">HDFS 分布式存储 / Distributed Storage</text>
  <text x="450" y="209" text-anchor="middle" font-size="10" fill="#c9d4ea">/user/taobao/ods/user_behavior/</text>

  <line x1="450" y1="222" x2="450" y2="250" stroke="#2E5496" stroke-width="2" marker-end="url(#a)"/>

  <!-- ODS -->
  <rect x="120" y="250" width="660" height="58" rx="8" fill="#F2F6FC" stroke="#2E5496" stroke-width="1.5"/>
  <rect x="120" y="250" width="120" height="58" rx="8" fill="#2E5496"/>
  <text x="180" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">ODS</text>
  <text x="260" y="274" font-size="12.5" font-weight="600" fill="#1F3864">贴源层 · Operational Data Store</text>
  <text x="260" y="292" font-size="11" fill="#595959">外部表 external · TextFile · 1亿行 · 不清洗 keep raw</text>

  <line x1="450" y1="308" x2="450" y2="332" stroke="#C55A11" stroke-width="2" marker-end="url(#b)"/>
  <text x="462" y="325" font-size="9.5" fill="#C55A11">清洗+分区+ORC</text>

  <!-- DWD -->
  <rect x="120" y="332" width="660" height="58" rx="8" fill="#F2F6FC" stroke="#2E5496" stroke-width="1.5"/>
  <rect x="120" y="332" width="120" height="58" rx="8" fill="#2E5496"/>
  <text x="180" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">DWD</text>
  <text x="260" y="356" font-size="12.5" font-weight="600" fill="#1F3864">明细层 · Data Warehouse Detail</text>
  <text x="260" y="374" font-size="11" fill="#595959">清洗 clean · 时间转换 · 按天分区(9) · ORC约2.3:1 · 9891万行</text>

  <line x1="450" y1="390" x2="450" y2="414" stroke="#C55A11" stroke-width="2" marker-end="url(#b)"/>
  <text x="462" y="407" font-size="9.5" fill="#C55A11">按主题聚合 aggregate</text>

  <!-- DWS -->
  <rect x="120" y="414" width="660" height="58" rx="8" fill="#F2F6FC" stroke="#2E5496" stroke-width="1.5"/>
  <rect x="120" y="414" width="120" height="58" rx="8" fill="#2E5496"/>
  <text x="180" y="448" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">DWS</text>
  <text x="260" y="438" font-size="12.5" font-weight="600" fill="#1F3864">汇总层 · Data Warehouse Summary</text>
  <text x="260" y="456" font-size="11" fill="#595959">用户宽表(99万) + 商品宽表(414万) · CTAS · 条件聚合</text>

  <line x1="450" y1="472" x2="450" y2="496" stroke="#C55A11" stroke-width="2" marker-end="url(#b)"/>
  <text x="462" y="489" font-size="9.5" fill="#C55A11">产出指标 metrics</text>

  <!-- ADS -->
  <rect x="120" y="496" width="660" height="72" rx="8" fill="#FBE9DD" stroke="#C55A11" stroke-width="1.5"/>
  <rect x="120" y="496" width="120" height="72" rx="8" fill="#C55A11"/>
  <text x="180" y="537" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">ADS</text>
  <text x="260" y="520" font-size="12.5" font-weight="600" fill="#7a3a0c">应用层 · Application Data Store</text>
  <text x="260" y="539" font-size="11" fill="#5c4632">· 转化漏斗 funnel (双口径)   · 加购未购名单 500万 (anti-join)</text>
  <text x="260" y="556" font-size="11" fill="#5c4632">· 每日转化趋势 daily trend (9天)</text>

  <!-- side note -->
  <text x="795" y="300" font-size="10" fill="#9aa5b5" transform="rotate(90 795 300)">粒度逐层变粗 · granularity coarsens ↓</text>

  <text x="450" y="600" text-anchor="middle" font-size="11" fill="#7f7f7f">引擎 Engine: Hive on Tez  ·  存储 Storage: HDFS + ORC  ·  环境 Env: Docker Compose</text>
  <text x="450" y="620" text-anchor="middle" font-size="10.5" fill="#9aa5b5">范式 Paradigm: ELT (先加载后转换 · load then transform)</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2E5496"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#C55A11"/></marker>
  </defs>
</svg>
